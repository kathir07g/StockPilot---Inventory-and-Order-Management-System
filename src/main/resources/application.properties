
spring.application.name=stockpilot

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stockpilot?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:stockpilot_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin-bootstrap.name=${ADMIN_NAME:}
app.admin-bootstrap.email=${ADMIN_EMAIL:}
app.admin-bootstrap.password=${ADMIN_PASSWORD:}
